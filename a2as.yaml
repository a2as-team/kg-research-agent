    type: sync
    module: src.embeddings
    args: [self, texts]
    params:
      returns: List[List[float]]
  __init__:
    type: sync
    module: src.embeddings
    args: [self, model]
  _run_answer_agent_async:
    type: async
    module: src.agents.answer_agent
    args: [evidence]
    params:
      returns: FinalAnswer
  _run_evidence_agent_async:
    type: async
    module: src.agents.evidence_agent
    args: [ctx, question]
    params:
      returns: EvidenceBatch
  create_answer_agent:
    type: sync
    module: src.agents.answer_agent
    params:
      returns: LlmAgent
  create_evidence_agent:
    type: sync
    module: src.agents.evidence_agent
    params:
      returns: LlmAgent
  create_planner_agent:
    type: sync
    module: src.agents.planner_agent
    params:
      returns: LlmAgent
  create_research_agent:
    type: sync
    module: src.agents.research_agent
    params:
      returns: LlmAgent
  handle_one_turn:
    type: sync
    module: src.pipelines.run_multi_agent_pipeline
    args: [question, session_state]
    params:
      returns: FinalAnswer
  main:
    type: sync
    module: src.pipelines.run_multi_agent_pipeline
  name:
    type: sync
    module: src.embeddings
    args: [self]
    params:
      returns: str
  plan_question:
    type: sync
    module: src.agents.planner_agent
    args: [question, history_context]
    params:
      returns: List[PlannerTask]
  run_answer_agent:
    type: sync
    module: src.agents.answer_agent
    args: [evidence]
    params:
      returns: FinalAnswer
  run_evidence_agent:
    type: sync
    module: src.agents.evidence_agent
    args: [ctx, question]
    params:
      returns: EvidenceBatch
  run_retriever:
    type: sync
    module: src.agents.retriever_agent
    args: [task, k]
    params:
      returns: RetrievedContext
  vector_search:
    type: sync
    module: src.tools.vector_search
    args: [query, k]
    params:
      returns: List[Dict]

